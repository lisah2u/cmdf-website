<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contribute - Cacapon Music and Dance Foundation</title>
    <meta name="description" content="Learn about our partners and supporters who help make the Cacapon Music and Dance Foundation's mission possible.">
    
    <!-- Tailwind Config (must load before CDN) -->
    <script src="assets/tailwind-config.js"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Fredericka+the+Great&family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Font Awesome for social media icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="assets/palette.css">

    <!-- CMDF Tailwind Configuration (already loaded above) -->

    <!-- CMDF Component Styles -->
    <link rel="stylesheet" href="assets/cmdf-components.css">
</head>
<body class="scroll-smooth">
    <!-- Header with centered logo on black background -->
    <header class="bg-black fixed w-full top-0 z-50">
        <nav class="container mx-auto px-6 py-4 relative flex items-center justify-between">
            <!-- Left Nav (desktop) -->
            <div class="hidden lg:flex items-center space-x-6 text-white">
                <a href="about.html" class="font-medium px-2 py-1 hover:text-gold transition-colors">About</a>
                <a href="programs.html" class="font-medium px-2 py-1 hover:text-gold transition-colors">Programs</a>
                <a href="events.html" class="font-medium px-2 py-1 hover:text-gold transition-colors">Events</a>
                <a href="partners.html" class="font-medium px-2 py-1 hover:text-gold transition-colors">Partners</a>
            </div>

            <!-- Mobile Menu Button -->
            <button id="mobile-menu-btn" class="lg:hidden text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Centered Logo -->
            <div class="absolute left-1/2 top-full -translate-x-1/2 -translate-y-[55%]">
                <a href="index.html" class="inline-block">
                    <img src="images/CMDF_LOGO_COLOR_8_x8_300_dpi.png" alt="Cacapon Music and Dance Foundation logo" class="h-20 md:h-24 w-auto object-contain" />
                </a>
            </div>

            <!-- Right Nav (desktop) -->
            <div class="hidden lg:flex items-center space-x-6 text-white">
                <a href="donate.html" class="font-medium px-2 py-1 hover:text-gold transition-colors flex items-center gap-2">
                    <i class="fas fa-bell text-sm text-gold bell-continuous"></i>
                    Donate
                </a>
                <a href="scholarships.html" class="font-medium px-2 py-1 hover:text-gold transition-colors">Scholarships</a>
                <a href="dance.html" class="font-medium px-2 py-1 hover:text-gold transition-colors">Dance</a>
            </div>
        </nav>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="lg:hidden hidden bg-black border-t border-white/10">
            <div class="px-6 py-4 space-y-4">
                <a href="about.html" class="block text-white hover:text-gold font-medium">About</a>
                <a href="programs.html" class="block text-white hover:text-gold font-medium">Programs</a>
                <a href="events.html" class="block text-white hover:text-gold font-medium">Events</a>
                <a href="partners.html" class="block text-white hover:text-gold font-medium">Partners</a>
                <a href="donate.html" class="block text-white hover:text-gold font-medium flex items-center gap-2">
                    <i class="fas fa-bell text-sm text-gold bell-continuous"></i>
                    Donate
                </a>
                <a href="scholarships.html" class="block text-white hover:text-gold font-medium">Scholarships</a>
                <a href="dance.html" class="block text-white hover:text-gold font-medium">Dance</a>
            </div>
        </div>

    <!-- Page Header -->
    <section class="pt-32 pb-16 bg-light-gray">
        <div class="container mx-auto px-6">
            <div class="max-w-4xl mx-auto text-center fade-in">
                <h1 class="text-5xl md:text-6xl font-bold text-cmdf-black mb-6">Donate</h1>
                <p class="text-xl text-medium-gray">
                    Learn how to join in.
                </p>
            </div>
        </div>
    </section>

    <!-- Partners Content -->
    <section class="py-20 bg-white">
        <div class="container mx-auto px-6">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-16 fade-in">
                    <p class="text-lg text-medium-gray">
                        Donation content will be added here.
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-black py-6">
        <div class="container mx-auto px-6 text-center">
            <p class="text-white font-medium">
                © 2025 Cacapon Music and Dance Foundation. All rights reserved.
            </p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/main.js"></script>

</html>
